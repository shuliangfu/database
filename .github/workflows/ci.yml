# CI: 三端跨平台测试（Deno / Bun / Node.js 22+），验证跨运行时兼容性
# 注意：自包含的 tests/sqlite/ 仍在 Deno / Bun / Node × Linux / macOS / Windows 共 9 个作业中运行。
#       query-logger.test.ts 的默认 fallback 断言为 locale-tolerant（接受 zh-CN"查询"/en-US"query"），不依赖 CI 环境语言。
# 注意：Postgres / MySQL / Mongo / integration 仅在 Linux 作业中跑（GitHub 托管的
#       Windows / macOS runner 不支持 service containers）。Mongo 以单节点副本集 rs0 启动，
#       先 rs.initiate 再创建测试用户，以满足事务用例。
# 注意：Deno 解析依赖图时需 --minimum-dependency-age=0 绕过 JSR 最小依赖日期约束。
# 注意：Node 22.x 的 node:sqlite 为实验特性，test-node.mjs 内传 --experimental-sqlite 标志。
name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Deno（Linux / macOS / Windows）
  # ─────────────────────────────────────────────────────────────────────────
  test-deno:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9

      - name: Cache dependencies
        continue-on-error: true
        run: deno cache --minimum-dependency-age=0 src/mod.ts

      - name: Check
        run: deno check --minimum-dependency-age=0 src/mod.ts

      - name: Lint
        run: deno lint src/

      - name: Test (Deno)
        env:
          CI: "true"
        run: deno test -A --minimum-dependency-age=0 --no-check tests/sqlite/

  # ─────────────────────────────────────────────────────────────────────────
  # Bun（Linux / macOS / Windows）
  # ─────────────────────────────────────────────────────────────────────────
  test-bun:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Test (Bun)
        env:
          CI: "true"
        run: bun test tests/sqlite/

  # ─────────────────────────────────────────────────────────────────────────
  # Node.js 22（Linux / macOS / Windows）
  # ─────────────────────────────────────────────────────────────────────────
  test-node:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Test (Node)
        run: npm run test:node

  # ─────────────────────────────────────────────────────────────────────────
  # 真实库集成测试（仅 Linux；Deno / Bun / Node 各跑一遍）
  # Postgres 超级用户设为 root，与 tests/shared/configs.ts 默认账号对齐。
  # Mongo 不用 service command（GHA services 不能改镜像入口参数），在步骤里
  # 以 --replSet rs0 启动，无鉴权 initiate 后再创建 root@admin。
  # ─────────────────────────────────────────────────────────────────────────
  test-integration-linux:
    name: integration (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [deno, bun, node]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: "8866231"
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: "8866231"
          MYSQL_DATABASE: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -p8866231 --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      CI: "true"
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: test
      MYSQL_USER: root
      MYSQL_PASSWORD: "8866231"
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DATABASE: postgres
      POSTGRES_USER: root
      POSTGRES_PASSWORD: "8866231"
      MONGODB_HOST: localhost
      MONGODB_PORT: "27017"
      MONGODB_DATABASE: test
      MONGODB_USER: root
      MONGODB_PASSWORD: "8866231"
      MONGODB_AUTH_SOURCE: admin
      MONGODB_REPLICA_SET: rs0
      MONGODB_DIRECT_CONNECTION: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        if: matrix.runtime == 'deno'
        with:
          deno-version: v2.9

      - uses: oven-sh/setup-bun@v2
        if: matrix.runtime == 'bun'

      - uses: actions/setup-node@v4
        if: matrix.runtime == 'node'
        with:
          node-version: "22"

      - name: Install Bun dependencies
        if: matrix.runtime == 'bun'
        run: bun install

      - name: Install Node dependencies
        if: matrix.runtime == 'node'
        run: npm install

      - name: Start MongoDB replica set rs0
        run: |
          set -euo pipefail
          docker run -d --name ci-mongo -p 27017:27017 mongo:7 \
            mongod --replSet rs0 --bind_ip_all

          echo "Waiting for mongod to accept connections..."
          for i in $(seq 1 40); do
            if docker exec ci-mongo mongosh --quiet --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; then
              echo "mongod is up"
              break
            fi
            if [ "$i" -eq 40 ]; then
              echo "MongoDB did not become ready" >&2
              docker logs ci-mongo || true
              exit 1
            fi
            sleep 2
          done

          docker exec ci-mongo mongosh --quiet --eval '
            try {
              const s = rs.status();
              if (s.ok !== 1) {
                throw new Error("not initiated");
              }
            } catch (_e) {
              rs.initiate({
                _id: "rs0",
                members: [{ _id: 0, host: "127.0.0.1:27017" }]
              });
            }
          '

          echo "Waiting for replica set primary..."
          for i in $(seq 1 40); do
            if docker exec ci-mongo mongosh --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)' >/dev/null 2>&1; then
              echo "replica set rs0 is primary"
              break
            fi
            if [ "$i" -eq 40 ]; then
              echo "Replica set did not elect a primary" >&2
              docker exec ci-mongo mongosh --quiet --eval 'rs.status()' || true
              exit 1
            fi
            sleep 2
          done

          docker exec ci-mongo mongosh admin --quiet --eval '
            try {
              db.createUser({
                user: "root",
                pwd: "8866231",
                roles: [{ role: "root", db: "admin" }]
              });
            } catch (e) {
              if (e.codeName !== "DuplicateKey" && e.code !== 51003) {
                throw e;
              }
            }
          '
          echo "MongoDB replica set rs0 is ready (user root@admin)"

      - name: Test (Deno)
        if: matrix.runtime == 'deno'
        run: deno test -A --minimum-dependency-age=0 tests/postgresql/ tests/mysql/ tests/mongo/ tests/integration/

      - name: Test (Bun)
        if: matrix.runtime == 'bun'
        run: bun test tests/postgresql/ tests/mysql/ tests/mongo/ tests/integration/

      - name: Test (Node)
        if: matrix.runtime == 'node'
        run: node test-node.mjs integration
